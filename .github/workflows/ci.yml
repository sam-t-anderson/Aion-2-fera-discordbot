# Tests on every push and pull request. The server's updater only installs a main
# revision after this workflow (it must stay named "CI") has passed for it.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Run every test script
        run: |
          for t in tests/test*.py; do
            echo "== $t"
            python "$t"
          done
      - name: Deploy scripts parse
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done
          python -m py_compile deploy/check-update-ci.py
